name: PyPI

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "The build number."
        required: true
        type: string
      index:
        description: "Target index: pypi or testpypi"
        required: true
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  id-token: write

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare build environment
        shell: bash -l {0}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          number="${BUILD_NUMBER}"
          if [[ "${number}" == "auto" ]]; then
            number="${RUN_NUMBER}"
          fi
          if ! [[ "${number}" =~ ^[0-9]+$ ]]; then
            echo "build_number must be 'auto' or a number" >&2
            exit 1
          fi
          echo "BUILD_NUMBER=${number}" >> "$GITHUB_ENV"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    needs: [build_sdist]
    name: Build ${{ matrix.python }}-${{ matrix.target.tag }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        python: [cp312, cp313, cp314]
        target:
          - { tag: manylinux_x86_64, os: ubuntu-latest }
          - { tag: manylinux_aarch64, os: ubuntu-latest }
          - { tag: manylinux_ppc64le, os: ubuntu-latest }
          - { tag: win_amd64, os: windows-latest }
          - { tag: macosx_arm64, os: macos-latest }
          - { tag: macosx_x86_64, os: macos-latest }
        include:
          - python: pp311
            target: { tag: manylinux_x86_64, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU
        if: endsWith(matrix.target.tag, 'linux_ppc64le') || endsWith(matrix.target.tag, 'linux_aarch64')
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Prepare build environment
        shell: bash -l {0}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
          INDEX: ${{ inputs.index }}
        run: |
          number="${BUILD_NUMBER}"
          if [[ "${number}" == "auto" ]]; then
            number="${RUN_NUMBER}"
          fi
          if ! [[ "${number}" =~ ^[0-9]+$ ]]; then
            echo "build_number must be 'auto' or a number" >&2
            exit 1
          fi
          cibw_environment="MACOSX_DEPLOYMENT_TARGET=14.0"
          cibw_environment+=" BUILD_NUMBER=${number}"
          if [[ "${INDEX}" == "testpypi" ]]; then
            cibw_environment+=" PIP_EXTRA_INDEX_URL=https://test.pypi.org/simple"
          fi
          echo "CIBW_ENVIRONMENT=${cibw_environment}" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.target.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-${{ matrix.python }}-${{ matrix.target.tag }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
