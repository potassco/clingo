name: CI

on:
  push:
    branches:
      - master
      - wip
      - wip-20
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: "Ninja Multi-Config"
          - os: macos-latest
            generator: "Ninja Multi-Config"
          - os: windows-latest
            generator: "Visual Studio 17 2022"
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: build-env
          auto-update-conda: true

      - name: Dependencies
        run: |
          pkgs=(cmake ninja pytest python c-compiler cxx-compiler re2c)
          conda install "${pkgs[@]}"

      - name: Configure
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
            -DCLINGO_BUILD_TESTS=On \
            -DCLINGO_BUILD_APP=On \
            -DCLINGO_BUILD_EXAMPLES=On \
            -DCLASP_BUILD_TESTS=On \
            -DCLASP_BUILD_EXAMPLES=On \
            -DLIB_POTASSCO_BUILD_TESTS=On

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Test
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: |
          cmake --install build --config Release
          clingo --version
          clasp --version
          lpconvert --version
