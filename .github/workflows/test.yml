name: CI tests

on:
  push:
    branches:
      - master
      - wip
  pull_request:

jobs:
  build:
    name: clingo ${{ matrix.python-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11"]
        include:
          - os: "ubuntu-latest"
            generator: "Ninja"
            build_type: "Debug"
            channels: "potassco/label/dev"
            env_file: ".github/tests/linux-env.yml"
          - os: "macos-latest"
            generator: "Ninja"
            build_type: "Debug"
            env_file: ".github/tests/macos-env.yml"
          - os: "windows-latest"
            generator: "Visual Studio 18 2026"
            build_type: "Release"
            env_file: ".github/tests/windows-env.yml"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ matrix.env_file }}
          init-shell: bash powershell
          cache-environment: true
          post-cleanup: "all"

      - name: print info
        shell: bash -el {0}
        run: |
          env
          micromamba info
          micromamba list
          python -m site

      - name: fix cffi
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          pip install cffi --force

      - name: build and test
        shell: bash -el {0}
        run: >
          PYTHONHOME=$CONDA_PREFIX
          ctest
          --output-on-failure
          --build-config "${{ matrix.build_type }}"
          --build-generator "${{ matrix.generator }}"
          --build-and-test . build
          --build-options -DCLINGO_BUILD_TESTS=On -DCLASP_BUILD_TESTS=ON -DLIB_POTASSCO_BUILD_TESTS=On -DCLINGO_BUILD_EXAMPLES=On
          --test-command ctest -V --build-config "${{ matrix.build_type }}"
