name: Deploy conda packages

on:
  workflow_dispatch:
    inputs:
      wip:
        description: "Publish work in progress package."
        type: boolean
        default: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version-number: ${{ steps.compute.outputs.version-number }}
      build-number: ${{ steps.compute.outputs.build-number }}
      channel-label: ${{ steps.compute.outputs.channel-label }}
    steps:
      - uses: actions/checkout@v6
      - id: compute
        run: |
          LABEL=${{ inputs.wip && 'dev-20' || 'main' }}
          VERSION_NUMBER=$(python ./scripts/config.py get-version)
          BUILD_NUMBER=$(python ./scripts/config.py build-number conda "${LABEL}")
          echo "channel-label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "version-number=${VERSION_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build-number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        arch: [x86_64, arm64]
        exclude:
          - os: ubuntu-latest
            arch: arm64
          - os: windows-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      BUILD_NUMBER: ${{ needs.meta.outputs.build-number }}
      VERSION_NUMBER: ${{ needs.meta.outputs.version-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Conda
        if: ${{ runner.os != 'linux' }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          channels: potassco/label/${{ needs.meta.outputs.channel-label }},conda-forge
          channel-priority: strict
          auto-update-conda: true

      - name: Install macos SDK
        if: ${{ matrix.os == 'macos-latest' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.9.sdk.tar.xz' -OutFile 'MacOSX10.9.sdk.tar.xz'
          sudo tar xf MacOSX10.9.sdk.tar.xz -C /opt
          Invoke-WebRequest -Uri 'https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz' -OutFile 'MacOSX11.3.sdk.tar.xz'
          sudo tar xf MacOSX11.3.sdk.tar.xz -C /opt

      - name: Write git hash
        run: python scripts/config.py write-git-hash

      - name: Build (linux)
        if: ${{ runner.os == 'linux' }}
        run: |
          mkdir artifacts
          chmod a+rwx artifacts
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/artifacts:/artifacts \
            quay.io/condaforge/linux-anvil-cos7-x86_64 /bin/bash -c "
              export VERSION_NUMBER=${{ env.VERSION_NUMBER }} && \
              export BUILD_NUMBER=${{ env.BUILD_NUMBER }} && \
              curl -L -o miniconda.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh && \
              bash miniconda.sh -b && \
              source ~/miniforge3/etc/profile.d/conda.sh && \
              conda activate base && \
              conda config --prepend channels potassco/label/${{ needs.meta.outputs.channel-label }} && \
              conda install -y tree conda-build && \
              conda-build /work/.github/conda --output-folder /artifacts --python ${{ matrix.python-version }} &&
              find /artifacts -mindepth 1 -exec chmod a+rwX {} +
            "

      - name: Build (macos_x86_64)
        shell: bash -e -o pipefail -l {0}
        if: ${{ runner.os == 'macos' && matrix.arch == 'x86_64' }}
        run: |
          set -x
          conda create --platform osx-64 -n build conda-build
          conda run -n build --no-capture-output arch -x86_64 conda-build .github/conda \
            --output-folder ./artifacts \
            --python "${{ matrix.python-version }}"

      - name: Build (windows/macos_arm64)
        shell: bash -e -o pipefail -l {0}
        if: ${{ runner.os != 'linux' && (runner.os != 'macos' || matrix.arch != 'x86_64') }}
        run: |
          set -x
          conda create -n build conda-build
          conda run -n build --no-capture-output conda-build .github/conda \
            --output-folder ./artifacts \
            --python "${{ matrix.python-version }}"

      - name: Cleanup artifacts
        shell: bash -e -o pipefail -l {0}
        run: |
          find artifacts -type f ! -name "*.conda" -delete
          find artifacts -type d -empty -delete
          find artifacts -type f -name "*.conda" -print -quit | grep -q . || { echo "No .conda artifacts found in artifacts/"; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: conda-packages-${{ matrix.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: artifacts

  upload:
    needs:
      - build
      - meta
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          channels: conda-forge
          channel-priority: strict
          activate-environment: conda-upload
          auto-update-conda: true

      - name: Install
        shell: bash -e -o pipefail -l {0}
        run: |
          conda install anaconda-client

      - name: Upload
        shell: bash -e -o pipefail -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          files=( $(find artifacts -type f -name "*.conda") )
          anaconda upload -l ${{ needs.meta.outputs.channel-label }} -u potassco --force "${files[@]}"
