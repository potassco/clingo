name: Conda

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Anaconda label"
        required: true
        type: string
      build_number:
        description: "Build number"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        arch: [x86_64, arm64]
        exclude:
          - os: ubuntu-latest
            arch: arm64
          - os: windows-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare build environment
        shell: bash -e -o pipefail -l {0}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          number="${BUILD_NUMBER}"
          if [[ "${number}" == "auto" ]]; then
            number="${RUN_NUMBER}"
          fi
          if ! [[ "${number}" =~ ^[0-9]+$ ]]; then
            echo "build_number must be 'auto' or a number" >&2
            exit 1
          fi
          VERSION=$(python -c "import re; print(next(re.finditer(r'CLINGO_VERSION \"([0-9.]+)\"', open('lib/c-api/include/clingo/core.h').read())).group(1))")
          echo "VERSION_NUMBER=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${number}" >> "$GITHUB_ENV"

      - name: Conda
        if: ${{ runner.os != 'linux' }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true

      - name: Build (linux)
        if: ${{ runner.os == 'linux' }}
        run: |
          mkdir artifacts
          chmod a+rwx artifacts
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/artifacts:/artifacts \
            quay.io/condaforge/linux-anvil-cos7-x86_64 /bin/bash -c "
              export VERSION_NUMBER=${{ env.VERSION_NUMBER }} && \
              export BUILD_NUMBER=${{ env.BUILD_NUMBER }} && \
              curl -L -o miniconda.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh && \
              bash miniconda.sh -b && \
              source ~/miniforge3/etc/profile.d/conda.sh && \
              conda activate base && \
              conda install -y tree conda-build && \
              conda-build /work/.github/conda --output-folder /artifacts --python ${{ matrix.python-version }} &&
              find /artifacts -mindepth 1 -exec chmod a+rwX {} +
            "

      - name: Build (macos_x86_64)
        shell: bash -e -o pipefail -l {0}
        if: ${{ runner.os == 'macos' && matrix.arch == 'x86_64' }}
        run: |
          set -x
          conda create --platform osx-64 -n build conda-build
          conda run -n build --no-capture-output arch -x86_64 conda-build .github/conda \
            --output-folder ./artifacts \
            --python "${{ matrix.python-version }}"

      - name: Build (windows/macos_arm64)
        shell: bash -e -o pipefail -l {0}
        if: ${{ runner.os != 'linux' && (runner.os != 'macos' || matrix.arch != 'x86_64') }}
        run: |
          set -x
          conda create -n build conda-build
          conda run -n build --no-capture-output conda-build .github/conda \
            --output-folder ./artifacts \
            --python "${{ matrix.python-version }}"

      - name: Cleanup artifacts
        shell: bash -e -o pipefail -l {0}
        run: |
          find artifacts -type f ! -name "*.conda" -delete
          find artifacts -type d -empty -delete
          find artifacts -type f -name "*.conda" -print -quit | grep -q . || { echo "No .conda artifacts found in artifacts/"; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: conda-packages-${{ matrix.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: artifacts

  upload:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          channels: conda-forge
          channel-priority: strict
          activate-environment: conda-upload
          auto-update-conda: true

      - name: Install
        shell: bash -e -o pipefail -l {0}
        run: |
          conda install anaconda-client

      - name: Upload
        shell: bash -e -o pipefail -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          files=( $(find artifacts -type f -name "*.conda") )
          anaconda upload -l "${{ inputs.label }}" -u potassco --force "${files[@]}"
