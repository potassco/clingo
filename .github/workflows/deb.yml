name: PPA/Cloudsmith

on:
  workflow_dispatch:
    inputs:
      wip:
        description: "Publish work in progress package."
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cloudsmith
            codename: noble
          - target: cloudsmith
            codename: resolute
          - target: cloudsmith
            codename: trixie
          - target: ppa
            codename: noble
          - target: ppa
            codename: resolute

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup gpg
        if: matrix.target == 'ppa'
        run: |
          echo "$POTASSCO_PPA_GPGKEY" | base64 --decode | gpg --batch --import
        env:
          POTASSCO_PPA_GPGKEY: ${{ secrets.POTASSCO_PPA_GPGKEY }}

      - name: Install Cloudsmith CLI
        if: matrix.target == 'cloudsmith'
        uses: cloudsmith-io/cloudsmith-cli-action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Write git hash
        run: python scripts/config.py write-git-hash

      - name: Build package
        run: |
          python scripts/debbuild.py ${{ matrix.target }} "${{ inputs.wip && 'wip-20' || 'stable' }}" "${{ matrix.codename }}" prepare create sync changes build

      - name: Stage artifacts
        if: matrix.target == 'ppa'
        run: |
          mkdir artifacts
          cp --parents \
            build/${{ matrix.codename }}/*.{changes,dsc} \
            build/${{ matrix.codename }}/*.tar.* \
            artifacts/

      - name: Stage artifacts
        if: matrix.target == 'cloudsmith'
        run: |
          mkdir artifacts
          rm build/${{ matrix.codename }}/binary/*-dbgsym_*.*
          cp --parents \
            build/${{ matrix.codename }}/binary/*.deb \
            artifacts/

      - name: Upload built package artifact for ${{ matrix.codename }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-${{ matrix.codename }}
          path: artifacts

  publish-cloudsmith:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: cloudsmith-*
          merge-multiple: true

      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Publish packages
        run: |
          for x in build/*; do
            codename="$(basename "$x")"
            python ./scripts/debbuild.py cloudsmith "${{ inputs.wip && 'wip-20' || 'stable' }}" "${codename}" put
          done

  publish-ppa:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        codename:
          - noble
          - resolute
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: ppa-${{ matrix.codename }}
          merge-multiple: true

      - name: Install dput
        run: sudo apt install dput

      - name: Setup gpg
        run: |
          echo "$POTASSCO_PPA_GPGKEY" | base64 --decode | gpg --batch --import
        env:
          POTASSCO_PPA_GPGKEY: ${{ secrets.POTASSCO_PPA_GPGKEY }}

      - name: Publish package
        run: python ./scripts/debbuild.py ppa "${{ inputs.wip && 'wip-20' || 'stable' }}" "${{ matrix.codename }}" put
