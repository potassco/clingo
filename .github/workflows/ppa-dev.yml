name: Deploy ppa package

on:
  workflow_dispatch:
    inputs:
      wip:
        description: "Publish work in progress package."
        type: boolean
        default: true

jobs:
  build_packages:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distribution: [resolute, noble, jammy, focal, bionic]

    env:
      distribution: ${{ matrix.distribution }}

    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install pbuilder pbuilder-scripts debootstrap devscripts dh-make dput dh-python dh-lua

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup gpg
        run: |
          echo "$POTASSCO_PPA_GPGKEY" | base64 --decode | gpg --batch --import
        env:
          POTASSCO_PPA_GPGKEY: ${{ secrets.POTASSCO_PPA_GPGKEY }}

      - name: Build deb and source package
        run: |
          cd .github/ppa-wip
          ./build.sh ${{ inputs.wip && 'wip' || 'stable'}} "$distribution" create sync changes build put
