<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Input/Output Example</title>
</head>
<body>
    <h1>WebAssembly Input/Output Example</h1>
    <textarea id="input" rows="5" cols="50" placeholder="Enter text here..."></textarea>
    <br>
    <button id="processButton">Process Input</button>
    <br>
    <h3>Output:</h3>
    <pre id="output"></pre>

    <script src="hello.js"></script>
    <script>
        const worker = new Worker('worker.js');
        const inputTextarea = document.getElementById('input');
        const outputPre = document.getElementById('output');
        const processButton = document.getElementById('processButton');

        worker.onmessage = function(e) {
            outputPre.textContent += e.data.stdout;
        };

        processButton.addEventListener('click', function() {
            const input = inputTextarea.value;
            worker.postMessage({ type: 'process', input: input });
        });
    </script>
</body>
</html>
