[version]
header_path = ../libclingo/clingo.h
macro_field = CLINGO_VERSION

[conda]
name = clingo
owner = potassco

[ppa]
name = clingo
key = 744d959e10f5ad73f9cf17cc1d150536980033d5
add_ppa = no
extra_depends = dh-python
    dh-lua
exclude = __pycache__
    .mypy_cache
    *,cover
    *.egg-info
    dist
    build
    third_party/catch
include = ../../app
    ../../cmake
    ../../clasp
    ../../lib*
    ../../third_party
    ../../CMakeLists.txt
    ../../README.md
    ../../INSTALL.md
    ../../LICENSE.md
    ../../CHANGES.md
