[version]
header_path = ../libclingo/clingo.h
macro_field = CLINGO_VERSION

[conda]
name = clingo
owner = potassco

[ppa]
key = 744d959e10f5ad73f9cf17cc1d150536980033d5
add_ppa = no
sync = --exclude __pycache__
    --exclude .mypy_cache
    --exclude '*,cover'
    --exclude '*.egg-info'
    --exclude dist
    --exclude build
    --exclude third_party/catch
    ../../app
    ../../cmake
    ../../clasp
    ../../lib*
    ../../third_party
    ../../CMakeLists.txt
    ../../README.md
    ../../INSTALL.md
    ../../LICENSE.md
    ../../CHANGES.md
