<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAssembly Hello World with Stdout Interception</title>
</head>
<body>
    <h1>WebAssembly Hello World with Stdout Interception</h1>
    <p id="output"></p>
    <p id="stdout"></p>

    <script src="hello.js"></script>
    <script>
        const worker = new Worker('worker.js');
        worker.onmessage = function(e) {
            document.getElementById('output').textContent = e.data.result;
            document.getElementById('stdout').textContent = "Stdout: " + e.data.stdout;
        };
    </script>
</body>
</html>
