[version]
header_path = lib/c-api/include/clingo/core.h
macro_field = CLINGO_VERSION

[pypi]
name = clingo

[conda]
name = clingo
owner = potassco

[cloudsmith]
name = clingo
owner = potassco

[ppa]
name = clingo
owner = potassco
key = 744d959e10f5ad73f9cf17cc1d150536980033d5

[deb]
add_repository = no
extra_depends = dh-python
exclude = __pycache__
    .mypy_cache
    *,cover
    *.egg-info
    dist
    build
    third_party/catch
include = app
    CHANGES.md
    cmake
    CMakeLists.txt
    INSTALL.md
    lib*
    LICENSE.md
    README.md
    scripts
    third_party
